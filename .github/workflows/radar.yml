name: AI Free Credit Radar
on:
  push:
    paths:
      - 'radar.py'
      - 'config.json'
      - 'dashboard.template.html'
      - 'tests/**'
      - '.github/workflows/radar.yml'
  workflow_dispatch:
  schedule:
    # UTC, 정각을 피해 실행. 30분 단위 시도(정확한 시간 보장 X)
    - cron: '13,43 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-workflow
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Collect
        id: collect
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py --once
      - name: Save state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f data/state.json ]; then exit 0; fi
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: save radar monitoring state'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
